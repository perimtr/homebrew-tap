name: Update cask

# Follows new PowerMate releases: reads the latest tag, checksums the
# disk image, and commits the new version. Runs daily, and can be run by
# hand right after cutting a release instead of waiting for the schedule.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow the latest release
        # Authenticated through gh. Anonymous API calls share one rate
        # limit per runner IP with every other tenant on that runner, so
        # the unauthenticated curl this used to make failed with 403
        # about every other day; the workflow token gets its own quota.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo perimtr/powermate --json tagName --jq .tagName)
          version="${tag#v}"
          current=$(awk -F'"' '/^  version /{print $2}' Casks/powermate.rb)
          if [ "$version" = "$current" ]; then
            echo "cask is already at $version"
            exit 0
          fi
          gh release download "$tag" --repo perimtr/powermate \
            --pattern "PowerMate-${version}.dmg" --output powermate.dmg
          sha=$(shasum -a 256 powermate.dmg | cut -d' ' -f1)
          rm powermate.dmg
          sed -i '' \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" \
            Casks/powermate.rb
          git config user.name "Perimtr LLC"
          git config user.email "noreply@perimtr.io"
          git add Casks/powermate.rb
          git commit -m "PowerMate ${version}"
          git push
          echo "updated cask from ${current:-none} to ${version}"
